services:
  db:
    build: ./docker/postgis
    # Só as variáveis que o banco precisa. O Compose lê os valores do .env.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        REQUIREMENTS: requirements-dev.txt
    env_file: .env
    # A imagem sobe o gunicorn como usuário sem privilégios (produção). No
    # desenvolvimento o código vem do host e precisa ser gravável (migrations,
    # media/, caches): runserver como root, como sempre foi.
    user: root
    command: python manage.py runserver 0.0.0.0:8000
    # Monta o código do host no container: editar um arquivo reinicia o
    # runserver sem precisar reconstruir a imagem.
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
